version: 1
project:
  title: "Deep Learning for Solving and Estimating Dynamic Models in Economics and Finance"
  authors:
    - name: Simon Scheidegger
      affiliation: University of Lausanne
  github: https://github.com/sischei/Deep_Learning_for_Solving_And_Estimating_Dynamic_Economic_Models
  bibliography:
    - references.bib
  # The claude-latex-to-myst checkout now lives at `_tools/` (paths here are
  # relative to this project root), and it carries ~180 markdown files of its
  # own. The explicit `toc:` below already means only listed files are built,
  # but that protection is incidental — switching to an auto-generated TOC
  # would silently pull the converter's own docs into the site. Excluding it
  # states the intent.
  exclude:
    - _tools/**
  # Book-mode numbering (qe-v4+). Numbered chapters 1–12, appendices A–F.
  numbering:
    book:
      enabled: true
    chapters:
      label: "Chapter %s"
    appendices:
      label: "Appendix %s"
  toc:
    - file: index.md
    - title: Front Matter
      section: frontmatter
      children:
        - file: preface.md
        - file: how_to_read.md
        - file: notation.md
        - file: execution_map.md
    - title: Chapters
      section: chapters
      children:
        - file: ch01_intro.md
        - file: ch02_deqns.md
        - file: ch03_irbc.md
        - file: ch04_nas.md
        - file: ch05_olg.md
        - file: ch06_ha_youngs.md
        - file: ch07_pinns.md
        - file: ch08_ctime_ha.md
        - file: ch09_surrogates_gps.md
        - file: ch10_smm.md
        - file: ch11_climate.md
        - file: ch12_synthesis.md
    - title: Appendices
      section: appendices
      children:
        - file: appA_glossary.md
        - file: appB_matrix_calc.md
        - file: appC_ito.md
        - file: appD_fixed_points.md
        - file: appE_reproducibility.md
        - file: appF_solutions.md
        # Web-only appendix (issue #32): the PDF has appendices A–F; this
        # page lists the companion notebooks and links to their rendered
        # pages below. Generated by scripts/update_appendix.py.
        - file: appG_notebooks.md
